<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="t d"><title id="t">JitterMap architecture</title><desc id="d">AWS retry configuration and scenarios enter a deterministic admission engine, then RVF and RuVector create evidence.</desc><rect width="1100" height="420" rx="28" fill="#0b1020"/><text x="50" y="65" fill="#fff" font-family="system-ui" font-size="34" font-weight="700">JitterMap</text><text x="50" y="100" fill="#94a3b8" font-family="system-ui" font-size="19">Fleet retry admission with replayable evidence</text><g font-family="system-ui" text-anchor="middle" font-size="18"><rect x="55" y="175" width="205" height="90" rx="15" fill="#1d4ed8"/><text x="158" y="215" fill="#fff">Scenario + AWS</text><text x="158" y="241" fill="#dbeafe">RetryConfig</text><rect x="355" y="175" width="230" height="90" rx="15" fill="#7c3aed"/><text x="470" y="215" fill="#fff">Deterministic</text><text x="470" y="241" fill="#ede9fe">admission engine</text><rect x="680" y="125" width="185" height="75" rx="15" fill="#0f766e"/><text x="772" y="170" fill="#fff">RVF witness</text><rect x="680" y="240" width="185" height="75" rx="15" fill="#047857"/><text x="772" y="285" fill="#fff">RuVector memory</text><rect x="935" y="175" width="120" height="90" rx="15" fill="#b45309"/><text x="995" y="215" fill="#fff">Receipt</text><text x="995" y="241" fill="#ffedd5">none</text></g><g stroke="#64748b" stroke-width="5"><path d="M260 220H355M585 210L680 163M585 230L680 277M865 163L935 205M865 277L935 235"/></g></svg>