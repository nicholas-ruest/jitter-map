<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
<title id="t">JitterMap execution and data flow</title>
<desc id="d">A typed Scenario and policy enter evaluate(), which validates once at the boundary, runs the deterministic simulate() engine, seals the result with an RVF witness, appends it to RuVector evidence memory, and returns a JSON receipt. Inside simulate(), each exhausted-budget retry is admitted, deferred for later refill, or denied closed. Animated tokens trace this pipeline; without motion the same stages are legible as static boxes and arrows.</desc>
<style>
  .tok { opacity: 0; }
  .tokA { animation: tok 3.4s linear infinite; }
  .tokB { animation: tok 3.4s linear infinite; animation-delay: -1.7s; }
  .branch { animation: branch 3.6s ease-in-out infinite; }
  .branch-defer { animation-delay: -1.2s; }
  .branch-deny { animation-delay: -2.4s; }
  .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.6s ease-in-out infinite; }
  @keyframes tok { 0% { transform: translateX(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateX(20px); opacity: 0; } }
  @keyframes branch { 0%, 100% { opacity: 0.15; } 50% { opacity: 1; } }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }
  @media (prefers-reduced-motion: reduce) {
    .tokA, .tokB, .branch, .pulse { animation: none !important; opacity: 1; }
  }
</style>
<rect width="1200" height="320" rx="24" fill="#0b1020"/>
<text x="40" y="42" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="700">Execution and data flow</text>
<defs>
  <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#64748b"/>
  </marker>
</defs>
<g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow2)">
  <path d="M180 165H198"/>
  <path d="M360 165H378"/>
  <path d="M600 165H618"/>
  <path d="M760 165H778"/>
  <path d="M920 165H938"/>
</g>
<g font-family="system-ui, sans-serif" text-anchor="middle">
  <rect x="40" y="110" width="140" height="110" rx="14" fill="#1d4ed8"/>
  <text x="110" y="158" font-size="15" font-weight="700" fill="#ffffff">CLI</text>
  <text x="110" y="178" font-size="11" fill="#dbeafe">Scenario + policy</text>
  <text x="110" y="193" font-size="11" fill="#dbeafe">JSON</text>

  <rect x="200" y="110" width="160" height="110" rx="14" fill="#1e3a8a"/>
  <text x="280" y="158" font-size="15" font-weight="700" fill="#ffffff">evaluate()</text>
  <text x="280" y="178" font-size="11" fill="#dbeafe">validate once at</text>
  <text x="280" y="193" font-size="11" fill="#dbeafe">the domain boundary</text>

  <rect x="380" y="110" width="220" height="110" rx="14" fill="#7c3aed"/>
  <text x="490" y="152" font-size="15" font-weight="700" fill="#ffffff">simulate()</text>
  <text x="490" y="204" font-size="10" fill="#ede9fe">deterministic event loop</text>
  <g font-size="10" fill="#fde68a" text-anchor="middle">
    <path d="M460 168 L430 185" stroke="#fde68a" stroke-width="2" class="branch"/>
    <text x="418" y="196" class="branch">admit</text>
    <path d="M490 168 L490 190" stroke="#fde68a" stroke-width="2" class="branch branch-defer"/>
    <text x="490" y="203" class="branch branch-defer">defer</text>
    <path d="M520 168 L552 185" stroke="#fde68a" stroke-width="2" class="branch branch-deny"/>
    <text x="563" y="196" class="branch branch-deny">deny</text>
  </g>

  <rect x="620" y="110" width="140" height="110" rx="14" fill="#0f766e"/>
  <text x="690" y="158" font-size="15" font-weight="700" fill="#ffffff">seal()</text>
  <text x="690" y="178" font-size="11" fill="#ccfbf1">RVF witness</text>
  <text x="690" y="193" font-size="11" fill="#ccfbf1">chain</text>
  <rect x="675" y="198" width="30" height="20" rx="4" fill="none" stroke="#5eead4" stroke-width="2" class="pulse"/>

  <rect x="780" y="110" width="140" height="110" rx="14" fill="#047857"/>
  <text x="850" y="158" font-size="15" font-weight="700" fill="#ffffff">memory</text>
  <text x="850" y="178" font-size="11" fill="#d1fae5">RuVector append</text>
  <text x="850" y="193" font-size="11" fill="#d1fae5">+ search</text>
  <circle cx="850" cy="208" r="6" fill="#6ee7b7" class="pulse"/>

  <rect x="940" y="110" width="140" height="110" rx="14" fill="#b45309"/>
  <text x="1010" y="158" font-size="15" font-weight="700" fill="#ffffff">Receipt</text>
  <text x="1010" y="178" font-size="11" fill="#ffedd5">JSON stdout</text>
  <text x="1010" y="193" font-size="11" fill="#ffedd5">authority: none</text>
</g>
<g fill="#fde68a">
  <circle cx="180" cy="165" r="5" class="tok tokA"/>
  <circle cx="180" cy="165" r="5" class="tok tokB"/>
  <circle cx="360" cy="165" r="5" class="tok tokA"/>
  <circle cx="360" cy="165" r="5" class="tok tokB"/>
  <circle cx="600" cy="165" r="5" class="tok tokA"/>
  <circle cx="600" cy="165" r="5" class="tok tokB"/>
  <circle cx="760" cy="165" r="5" class="tok tokA"/>
  <circle cx="760" cy="165" r="5" class="tok tokB"/>
  <circle cx="920" cy="165" r="5" class="tok tokA"/>
  <circle cx="920" cy="165" r="5" class="tok tokB"/>
</g>
</svg>
