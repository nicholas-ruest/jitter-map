name: CI
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt,clippy
      - uses: EmbarkStudios/cargo-deny-action@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-targets --all-features --locked
      - name: Gate 1 — dependency-direction structural checker (docs/architecture.md §8)
        run: python3 scripts/check_dependency_direction.py
      - run: cargo run --locked -p jitter-evaluation --bin jitter-benchmark > evidence/ci-benchmark.json
      - run: cargo run --locked -p jitter-evaluation --bin jitter-fairness-benchmark > evidence/ci-fairness-benchmark.json
