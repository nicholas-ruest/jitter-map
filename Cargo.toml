[package]
name = "jitter-map"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Deterministic retry schedule simulator and collision analyzer"
license = "MIT"
repository = "https://github.com/nicholas-ruest/jitter-map"
readme = "README.md"
keywords = ["backoff", "jitter", "reliability", "cli"]
categories = ["command-line-utilities", "simulation"]

[dependencies]
clap = { version = "4.5.48", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
