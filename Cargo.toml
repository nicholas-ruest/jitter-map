[workspace]
members = ["crates/jitter-domain", "crates/jitter-application", "crates/jitter-adapter-aws", "crates/jitter-adapter-ruvnet", "crates/jitter-evaluation"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/nicholas-ruest/jitter-map"

[workspace.dependencies]
anyhow = "1.0.100"
aws-smithy-types = "1.3.4"
clap = { version = "4.5.48", features = ["derive"] }
hex = "0.4.3"
ruvector-core = "2.3.1"
rvf-crypto = "0.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.17"

[package]
name = "jitter-map"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Fleet-level retry admission simulator with auditable outcome memory"
readme = "README.md"

[dependencies]
anyhow.workspace = true
clap.workspace = true
jitter-application = { version = "0.2.0", path = "crates/jitter-application" }
jitter-adapter-aws = { version = "0.2.0", path = "crates/jitter-adapter-aws" }
jitter-adapter-ruvnet = { version = "0.2.0", path = "crates/jitter-adapter-ruvnet" }
jitter-domain = { version = "0.2.0", path = "crates/jitter-domain" }
serde_json.workspace = true

[[bin]]
name = "jitter-map"
path = "src/main.rs"
