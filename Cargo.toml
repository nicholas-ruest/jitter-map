[workspace]
members = [
    "crates/jitter-scenario",
    "crates/jitter-workload",
    "crates/jitter-policy",
    "crates/jitter-budget",
    "crates/jitter-scheduler",
    "crates/jitter-outcome",
    "crates/jitter-simulation",
    "crates/jitter-recovery",
    "crates/jitter-ports",
    "crates/jitter-application",
    "crates/jitter-adapter-aws",
    "crates/jitter-adapter-ruvector",
    "crates/jitter-adapter-rvf",
    "crates/jitter-adapter-ruflo",
    "crates/jitter-adapter-metaharness",
    "crates/jitter-evidence",
    "crates/jitter-config",
    "crates/jitter-observability",
    "crates/jitter-service",
    "crates/jitter-cli",
    "crates/jitter-evaluation",
    "crates/jitter-contract-tests",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/nicholas-ruest/jitter-map"

[workspace.dependencies]
anyhow = "1.0.100"
aws-smithy-types = "1.3.4"
clap = { version = "4.5.48", features = ["derive"] }
hex = "0.4.3"
ruvector-core = "2.3.1"
rvf-crypto = "0.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.17"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
